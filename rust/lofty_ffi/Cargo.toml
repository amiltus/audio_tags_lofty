[package]
name = "lofty_ffi"
version = "0.0.5"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 0.24.0 fails to compile with Rust 1.88 in Lofty's IFF parser. Keep the
# version aligned with the already-validated server extractor until upstream
# ships a compatible release.
lofty = "=0.22.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
